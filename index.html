<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Dashboard</title>
    <style>
    /* Reset & Base Setup */
    * { 
        padding: 0; 
        margin: 0; 
        box-sizing: border-box; 
    }

    body { 
        font-family: system-ui, -apple-system, sans-serif; 
        background-color: powderblue; 
        padding: 10px;
    }

    /* Layout Wrapper */
    .container {
        max-width: 1360px;
        width: 100%;
        margin: 0 auto;
    }

    /* Header Navigation - Mobile First Stacked */
    header { 
        margin: 10px auto 20px auto; 
        padding: 20px; 
        background-image: linear-gradient(to right, #383569, #4a478a); 
        color: white; 
        border-radius: 20px; 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        gap: 15px;
        text-align: center;
    }

    header .logo { 
        font-size: 26px; 
        font-weight: bold; 
        text-transform: uppercase; 
    }

    .nav-container { 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        gap: 15px; 
        width: 100%;
    }

    .nav-links { 
        display: flex; 
        flex-direction: column;
        gap: 10px;
        list-style: none; 
        align-items: center; 
    }

    .nav-links li a { 
        text-transform: uppercase; 
        font-size: 14px; 
        font-weight: bold; 
        padding: 8px 12px; 
        color: white; 
        text-decoration: none; 
        transition: color 200ms ease; 
    }

    .nav-links li a:hover { 
        color: orangered; 
    }

    .nav-buttons { 
        display: flex; 
        gap: 10px; 
        width: 100%;
        justify-content: center;
    }

    /* Buttons */
    button { 
        padding: 10px 24px; 
        color: white; 
        background-color: blue; 
        border: 1px solid silver; 
        border-radius: 20px; 
        text-transform: uppercase; 
        font-weight: 900; 
        cursor: pointer; 
        font-size: 13px;
        transition: background-color 200ms ease, color 200ms ease; 
    }

    .btn:hover { 
        color: black; 
        background-color: gold; 
    }

    .rgt:hover { 
        color: white; 
        background-color: green; 
    }

    /* Upper Interactive Inputs Bar */
    .input-box {
        margin: 15px auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .search-box, .date-box { 
        height: 40px; 
        border: 1px solid purple;  
        color: black; 
        padding: 0 12px;
        border-radius: 12px;
        width: 100%;
        font-size: 14px;
    }

    .date-box { 
        transition: background-color 0.3s ease;
    }

    .date-box:hover {
        background-color: aqua;
    }

    .myp1 {
        color: #383569;
        font-size: 20px; 
        font-weight: 800; 
        text-transform: uppercase;
        text-align: center;
        padding: 5px 0;
    }

    .myp1 span {
        color: orangered;
    }

    /* Main Section */
    section { 
        margin: 25px auto; 
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .section-header h2 {
        text-transform: uppercase;
        font-size: 18px;
        font-weight: 800;
        color: #383569;
    }

    .b1 {
        background-color: transparent;
        color: #383569;
        padding: 6px 16px;
    }

    .b1:hover {
        background-color: #383569;
        color: white;
    }

    /* I HAVE ADDED AUTO FIT PAMENEPO */
    .wrapper { 
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 15px;
        width: 100%;
    }

    .card { 
        min-height: 110px; 
        border-radius: 12px; 
        background-color: #4a478a; 
        padding: 15px; 
        text-transform: uppercase; 
        font-size: 11px; 
        color: orange; 
        text-align: center; 
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        transition: background-color 0.4s ease, color 0.4s ease, transform 0.4s ease;
    }

    .card h3 {
        font-size: 14px;
        color: white;
    }

    .card p {
        font-size: 12px;
        color: orange;
    }

    .card:hover {
        background-color: green;
        color: white;
        transform: scale(1.03);
    }

    /* Scalable Tables Layout */
    .table-container {
        width: 100%;
        overflow-x: auto;
        border: 2px solid silver;
        border-radius: 16px;
        margin-top: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
        background-image: linear-gradient(to bottom, #002b2b, #004d4d);
        color: white;
        text-transform: uppercase;
        font-size: 13px;
    }

    th, td {
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 10px;
        white-space: nowrap;
    }

    th {
        background-color: darkblue;
        font-weight: bold;
    }

    td sup {
        color: orangered;
        margin-left: 3px;
    }

    .b2 {
        width: 100%;
        max-width: 320px;
        height: 50px;
        border-radius: 25px;
        color: white;
        background-color: green;
        text-transform: uppercase;
        font-size: 16px;
        transition: all 0.3s ease;
        margin: 20px auto;
        display: block;
    }

    .b2:hover {
        color: purple;
        background-color: transparent;
        border: 2px solid black;
    }

    /* Support Module Footer Area */
    .house {
        background-color: #4a478a;
        color: white;
        margin: 25px auto 10px auto;
        padding: 20px;
        border-radius: 24px;
    }

    .last {
        text-align: center;
        text-transform: uppercase;
        font-size: 24px;
        font-weight: 800;
        color: white;
        margin-bottom: 10px;
    }

    .last span {
        color: orangered;
    }

    .p1 {
        text-transform: capitalize;
        font-size: 13px;
        font-weight: 500;
        color: #e0e0e0;
        text-align: center;
        margin-bottom: 15px;
    }

    .p1 i {
        color: gold;
        font-style: normal;
        margin-right: 4px;
    }

    /* Fluid Grid Form Elements */
    .form-container {
        width: 100%;
        max-width: 450px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .input-boxx, .text {
        width: 100%;
        border-radius: 8px;
        border: 1px solid slategray;
        padding: 12px;
        font-size: 14px;
        background-color: white;
    }

    .input-boxx {
        height: 42px;
    }

    .text {
        height: 100px;
        resize: vertical;
    }

    .b3 {
        width: 120px;
        height: 40px;
        text-transform: uppercase;
        border-radius: 20px;
        color: white;
        background-color: #002b2b;
        margin: 5px auto 0 auto;
        border: none;
    }

    /* ==========================================================================
       IYIYI NDIYA RESPONSIVENESS KUTI IZIGWIRA ON BOTH DEVICES TITELO
       ========================================================================== */
       
    /* Aka ndikamafoni small small */
    @media (min-width: 600px) {
        .input-box {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .search-box { width: 40%; }
        .date-box { width: 25%; }
        .myp1 { text-align: right; }
        
        .wrapper {
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }
    }

    /* Kuti izigwira paliponse */
    @media (min-width: 900px) {
        body {
            padding: 20px;
        }
        
        header {
            flex-direction: row;
            justify-content: space-between;
            height: 75px;
            border-radius: 30px;
            padding: 0 30px;
        }
        
        .nav-container {
            flex-direction: row;
            width: auto;
            gap: 30px;
        }
        
        .nav-links {
            flex-direction: row;
            gap: 15px;
        }
        
        .nav-buttons {
            width: auto;
        }
        
        .section-header h2 {
            font-size: 22px;
        }
        
        table {
            font-size: 14px;
        }
        
        .last {
            font-size: 30px;
        }
        
        .p1 {
            font-size: 15px;
        }
    }
</style>
</head>
<body>

    <div class="container">
        <!-- Responsive Nav Area -->
        <header>
            <div class="logo">E-commerce</div>
            <nav class="nav-container">
                <ul class="nav-links">
                    <li><a href="#">products</a></li>
                    <li><a href="#">shipping</a></li>
                    <li><a href="#">prices</a></li>
                    <li><a href="#">contacts</a></li>
                </ul>
                <div class="nav-buttons">
                    <button class="btn" type="button">login</button>
                    <button class="rgt" type="button">register</button>
                </div>
            </nav>
        </header>

        <!-- Apa ndi layout -->
        <div class="input-box">
            <input type="text" class="search-box" placeholder="Search products...">
            <input type="date" class="date-box">
            <div class="myp1">Sale <span>50% OFF</span></div>
        </div>

        <!-- Catalog Selection Grid -->
        <section>
            <div class="section-header">
